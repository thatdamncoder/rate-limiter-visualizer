events {}

http {
    # Docker's embedded DNS. Re-resolving per request lets nginx discover every
    # replica of the "app" service and round-robin across them.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            # A variable forces runtime DNS resolution (open-source nginx), so
            # `--scale app=3` is picked up without editing this file.
            set $upstream "http://app:8080";
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
