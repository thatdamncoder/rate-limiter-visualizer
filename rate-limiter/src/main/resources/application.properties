spring.application.name=ratelimiter

# Storage backend for rate-limit state:
#   redis  -> distributed state shared by every app instance (default, used in Docker)
#   memory -> original single-JVM ConcurrentHashMap implementation (no Redis needed)
spring.profiles.active=${RL_PROFILE:redis}

# Redis connection (Docker Compose sets REDIS_HOST=redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

server.port=${SERVER_PORT:8080}
